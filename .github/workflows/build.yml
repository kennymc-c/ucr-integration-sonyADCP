# Manual triggered GitHub action to build a distribution binary of the Python integration driver and attach it to a release draft including a hash file
---
name: "Build & Draft Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"


env:
  INTG_NAME: sonyadcp
  # Python version to use in the builder image. See https://hub.docker.com/r/unfoldedcircle/r2-pyinstaller for possible versions.
  PYTHON_VER: 3.11.13-0.6.0
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Get version and id
        id: get-version-and-id
        run: |
          echo "VERSION=$(jq .version -r driver.json)" >> $GITHUB_ENV
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_ENV
          echo "VERSION=$(jq .version -r driver.json)" >> $GITHUB_OUTPUT
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_OUTPUT

      - name: Build aarch64 binary (for remote installation)
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          echo "Starting pyinstaller build (aarch64)"
          docker run --rm --name builder-arm64 \
            --platform=linux/arm64/v8 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "python -m pip install -r /workspace/requirements.txt && \
              cd /workspace/intg-${INTG_NAME} && \
              pyinstaller --clean --onedir --name driver_build --collect-all zeroconf driver.py && \
              mv dist /workspace/dist-arm64 && \
              rm -rf build"
          echo "=== dist-arm64 contents ==="
          ls -laR ${GITHUB_WORKSPACE}/dist-arm64 || echo "dist-arm64 MISSING"

      - name: Build amd64 binary (for Docker image)
        run: |
          echo "Starting Docker pyinstaller build (amd64)"
          # Running the official Unfolded Circle builder natively for x86_64
          docker run --rm --name builder-amd64 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "python -m pip install -r /workspace/requirements.txt && \
              cd /workspace/intg-${INTG_NAME} && \
              pyinstaller --clean --onedir --name driver_build --collect-all zeroconf driver.py && \
              mv dist /workspace/dist-amd64 && \
              rm -rf build"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/bin
          # Changed to cp -r so files are preserved for the Docker step below
          cp -r dist-arm64/driver_build/* artifacts/bin/
          # Rename the executable binary from 'driver_build' to 'driver'
          mv artifacts/bin/driver_build artifacts/bin/driver
          cp driver.json artifacts/
          echo "ARTIFACT_NAME=uc-intg-${{ env.DRIVER_ID }}-${{ env.VERSION }}-aarch64" >> $GITHUB_ENV

          mkdir -p docker-artifacts/bin-amd64 docker-artifacts/bin-arm64
          
          # Setup AMD64 Docker Context
          cp -r dist-amd64/driver_build/* docker-artifacts/bin-amd64/
          mv docker-artifacts/bin-amd64/driver_build docker-artifacts/bin-amd64/driver
          cp driver.json docker-artifacts/bin-amd64/ 
          
          # Setup ARM64 Docker Context
          cp -r dist-arm64/driver_build/* docker-artifacts/bin-arm64/
          mv docker-artifacts/bin-arm64/driver_build docker-artifacts/bin-arm64/driver
          cp driver.json docker-artifacts/bin-arm64/

      - name: Create upload artifact archive
        shell: bash
        run: |
          tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${GITHUB_WORKSPACE}/artifacts .
          ls -lah

      - uses: actions/upload-artifact@v7
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (amd64)
        uses: docker/build-push-action@v6
        with:
          # Tell Docker to look at the root of the repository
          context: . 
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            DRIVER_ID=${{ env.DRIVER_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/intg-${{ env.DRIVER_ID }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/intg-${{ env.DRIVER_ID }}:latest

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: uc-intg-${{ needs.build.outputs.driver_id }}-${{ needs.build.outputs.version }}-aarch64

      - name: Extract build archives from downloaded files
        run: |
          ls -R
          for D in * 
            do if [ -d "${D}" ]; then
              mv $D/* ./
            fi
          done;

      - name: Create hash file
        run: |
          for filename in *.tar.gz; do echo "sha256  `sha256sum $filename`" >> ${{needs.build.outputs.driver_id}}.hash; done;

      - name: Create release draft
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.gz,${{needs.build.outputs.driver_id}}.hash"
          draft: true
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          tag: v${{needs.build.outputs.version}}